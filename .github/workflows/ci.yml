name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what production runs (runtime.txt); 3.12 is the local dev version.
        # Both are tested because #16 was a Cloud-only break that a 3.12-only job
        # would have passed straight through.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        # Unit tests + the AppTest smoke (full-pipeline runtime check).
        # Browser/kaleido image export is mocked in tests and the one real-render
        # test skips when no browser is present, so no system Chromium is needed here.
        run: python -m pytest -q
